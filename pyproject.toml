[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-mesh"
version = "0.1.0"
description = "Knowledge Mesh POC: document RAG, structured catalog, key discovery, business glossary and RDF knowledge graph."
readme = "README.md"
requires-python = ">=3.11"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "llama-index-core>=0.12",
  "sentence-transformers>=3.0",
  "rdflib>=7.0",
  "pyshacl>=0.26",
  "httpx>=0.27",
  "beautifulsoup4>=4.12",
  "pypdf>=4.0",
  "python-docx>=1.1",
  "pyarrow>=15",
  "numpy>=1.26",
  "sqlalchemy>=2.0",
  "sqlglot>=30.29",
  "mcp>=1.2",
  "opentelemetry-api>=1.25",
  "opentelemetry-sdk>=1.25",
  "opentelemetry-exporter-otlp-proto-grpc>=1.25",
  "opentelemetry-exporter-prometheus>=0.46b0",
  "prometheus-client>=0.20",
  "psutil>=5.9",
  "keyring>=25",
]

[project.optional-dependencies]
google = ["google-genai>=1.0"]
openai = ["openai>=1.40"]
databricks = ["databricks-sql-connector>=3.0"]
eval = ["ragas>=0.2", "langchain-google-genai>=2.0"]  # Ragas evaluator LLM = the configured Gemini model
laya = ["laya>=0.4.32"]
databases = ["psycopg[binary]>=3.1", "pymysql>=1.1", "pymssql>=2.3", "oracledb>=2.0"]
dev = ["pytest>=8", "reportlab>=4"]

[project.scripts]
knowledge-mesh = "knowledge_mesh.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
knowledge_mesh = ["api/static/*", "api/static/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
