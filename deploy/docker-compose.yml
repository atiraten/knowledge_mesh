# Local observability stack for the Knowledge Mesh POC, run with Podman (podman compose).
# Start/stop it with scripts/observability.sh (or scripts/mesh.sh for the stack plus the app).
# App -> OTLP (localhost:4317) -> collector -> Phoenix (traces) and Loki (logs).
# Prometheus scrapes the app's /metrics endpoint and sends firing alerts to Alertmanager, which posts
# them to the app (/api/ops/alerts, bearer token from deploy/secrets/alert_webhook_token).
# UIs: Phoenix http://localhost:6006 · Grafana http://localhost:3000 · Prometheus http://localhost:9090
#      Alertmanager http://localhost:9093
# Ports are bound to 127.0.0.1 only; put authentication in front before exposing them.

services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"   # OTLP gRPC (app default endpoint)
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    depends_on: [phoenix, loki]

  phoenix:
    image: arizephoenix/phoenix:version-21.2.1
    ports:
      - "127.0.0.1:6006:6006"
    environment:
      - PHOENIX_WORKING_DIR=/mnt/data
      # Phoenix 21 enables authentication by default and then rejects OTLP traces without an API key.
      # This stack is bound to 127.0.0.1 only; enable auth (plus PHOENIX_SECRET and an API key for the
      # collector and the app) before exposing it.
      - PHOENIX_ENABLE_AUTH=false
      - PHOENIX_TELEMETRY_ENABLED=false   # no usage telemetry sent to Arize
    volumes:
      - phoenix-data:/mnt/data

  loki:
    image: grafana/loki:3.2.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    ports:
      - "127.0.0.1:3100:3100"

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    extra_hosts:
      - "host.docker.internal:${MESH_HOST_IP:-host-gateway}"   # override with MESH_HOST_IP
    depends_on: [alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.34.2
    command: ["--config.file=/etc/alertmanager/alertmanager.yml", "--storage.path=/alertmanager"]
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/alert_webhook_token:/etc/alertmanager/secrets/alert_webhook_token:ro   # the file, not the 700 folder
    ports:
      - "127.0.0.1:9093:9093"
    extra_hosts:
      - "host.docker.internal:${MESH_HOST_IP:-host-gateway}"   # override with MESH_HOST_IP

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"
    depends_on: [prometheus, loki, alertmanager]

volumes:
  phoenix-data:
