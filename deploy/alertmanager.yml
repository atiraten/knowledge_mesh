# Alertmanager: routes every Knowledge Mesh alert to the app, which stores and shows it
# (Search page banner, GET /api/ops/alerts, logs). Add e-mail/Slack receivers here for production.
route:
  receiver: knowledge-mesh
  group_by: [alertname]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 4h

receivers:
  - name: knowledge-mesh
    webhook_configs:
      - url: http://host.docker.internal:8000/api/ops/alerts   # the app's port (scripts/mesh.sh default)
        send_resolved: true
        http_config:
          authorization:
            type: Bearer
            credentials_file: /etc/alertmanager/secrets/alert_webhook_token
